# OpenArbi Shadow Fiend palette, ported from the supplied Ghostty theme.
background #08090b
foreground #e6e3e4
# 90% background opacity; a 30% color tint leaves 70% artwork contribution.
background_opacity 0.90
background_tint 0.30
# Radius on macOS; enables compositor-provided blur on supported Linux desktops.
background_blur 20
background_image ../assets/shadow-fiend.png
background_image_layout cscaled
background_image_linear yes
cursor #ed5b67
cursor_text_color #08090b
selection_background #53212b
selection_foreground #f6edf0
active_border_color #582630
inactive_border_color #151318
macos_titlebar_color background
linux_display_server auto
font_family JetBrains Mono
font_size 12.0
window_padding_width 8
tab_bar_style separator
tab_bar_min_tabs 2
active_tab_foreground #f6edf0
active_tab_background #53212b
inactive_tab_foreground #8a7d85
inactive_tab_background #08090b
enable_audio_bell no
color0 #151318
color1 #e56875
color2 #a8bd9a
color3 #d5b38c
color4 #a0b2d0
color5 #bd98bd
color6 #9dbfbe
color7 #ddd5d8
color8 #8a7d85
color9 #ff8992
color10 #c2d6ae
color11 #ebcaa1
color12 #bbcbed
color13 #d6b3d6
color14 #b9d9d6
color15 #f6f0f2
